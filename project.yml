# XcodeGen manifest — generates Genesyx.xcodeproj from this declarative spec, so the project
# file never needs to be hand-edited or committed in a fragile state.
#
# On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open Genesyx.xcodeproj
#
# The app target links the local GenesyxCore Swift package (pure domain logic + tests).

name: Genesyx
options:
  bundleIdPrefix: com.genesyx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GenesyxCore:
    path: .
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.50.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Genesyx:
    type: application
    platform: iOS
    sources:
      - path: App/Genesyx
        excludes:
          - "**/*.md"
    dependencies:
      - package: GenesyxCore
        product: GenesyxCore
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: App/Genesyx/Genesyx.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: App/Genesyx/Info.plist
      properties:
        CFBundleDisplayName: Genesyx
        # Driven by MARKETING_VERSION / CURRENT_PROJECT_VERSION below. Without these two lines
        # xcodegen rewrites Info.plist with its defaults (1.0 / 1) on every regenerate, silently
        # undoing the shipped build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Supabase credentials (empty for local-only v1). Provide via Secrets.xcconfig or build
        # settings to activate the remote layer — see docs/SUPABASE.md.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # No standard/exempt encryption beyond HTTPS → skips the export-compliance prompt each upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Deep link for partner invites (genesyx://invite/{code})
        GIDClientID: 413702980668-tfah1knspa8ip82p51c3i3veuh3ljul4.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: com.genesyx.app
            CFBundleURLSchemes:
              - genesyx
          - CFBundleURLName: com.genesyx.app.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.413702980668-tfah1knspa8ip82p51c3i3veuh3ljul4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genesyx.app
        # 1.2.0, not 1.1.2: the client change list is a feature batch, not a fix pass — a weekly
        # Learn series, intimacy logging, per-supplement reminder times, the fertile-window
        # notification.
        MARKETING_VERSION: "1.2.0"
        # Build number MUST exceed the highest build already in App Store Connect / TestFlight.
        # 13 = 1.4.1 resubmission; 15 = full vaginal-pH migration (1.1.0). 16 = 1.1.1 for external
        # TestFlight. 17 = 1.1.1 with the Track/UX batch (reorder, pH spine, glasses hydration,
        # manual supplements). 18 = 1.2.0, the client change list — see docs/TESTFLIGHT_B18.md.
        # (14 was a wording-only WIP, never uploaded.)
        # 19 = 1.2.0 respin. Build 18 was archived 13 Aug and is void: it predates the mandatory
        # auth gate, the free guide, the partner withholding and the password-reset fix (all 14 Aug).
        # 20 = 1.2.0 with the password recovery flow. 19 was archived 17 Aug at 12:48 from fb37e2a
        # and stays frozen at that tree; it can send a reset email but has no deep-link handler, so
        # the link in her inbox still dies. Reusing 19 for this code would put two different
        # binaries behind one build number, and App Store Connect would reject the second anyway.
        # 21 = 1.2.0 with Article 9 consent (copy v2), Apple token revocation on delete, and the
        # pregnancy placeholder gated off. Build 20 is void for submission: it predates all three,
        # and the consent capture is the one Apple review and the ICO would both look for.
        # 22 = 1.2.0 with the consent gate made honest at the surface. Build 21 enforced Article 9
        # correctly at the repositories and invisibly at the UI: every save path dismissed whether or
        # not the write landed, so a withdrawn user filled a form, tapped Save and lost the entry in
        # silence. It also left the *read* side ungated, so the app pulled her health data back down
        # from the server after she had withdrawn. 21 is void for submission on the second point
        # alone — it is the claim the App Review notes make.
        CURRENT_PROJECT_VERSION: "22"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Supabase (publishable/anon key is public — safe to ship). project epltxklawpcxxbaleswg.
        SUPABASE_URL: "https://epltxklawpcxxbaleswg.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_eR7nEFBHD_4ATbjEeRbicA_Z3Qj_Elb"
        # SF MEDIA & PR LTD.
        DEVELOPMENT_TEAM: M5L3MM75SG
        CODE_SIGN_STYLE: Automatic
      configs:
        # Archiving signs MANUALLY with the App Store distribution profile. Automatic signing tries
        # to mint an iOS *Development* profile first and Apple refuses ("your team has no devices"),
        # which is what broke the build-9 archive. Setting it here rather than on the xcodebuild
        # command line is deliberate: a command-line setting leaks into every SPM package target
        # (GoogleSignIn, AppAuth, …), and those don't support provisioning profiles at all.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Genesyx App Store"

  GenesyxAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/GenesyxTests
    dependencies:
      - target: Genesyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genesyx.app.tests
        GENERATE_INFOPLIST_FILE: YES

  GenesyxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/GenesyxUITests
    dependencies:
      - target: Genesyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genesyx.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Genesyx:
    build:
      targets:
        Genesyx: all
        GenesyxAppTests: [test]
        GenesyxUITests: [test]
    test:
      targets:
        - GenesyxAppTests
        - GenesyxUITests
      gatherCoverageData: true
